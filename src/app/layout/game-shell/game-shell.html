<section class="game-shell" aria-label="Biofactory Lunar game shell">
  <app-hud-top />

  <main class="game-shell__body" aria-label="State-backed operations">
    <aside class="game-shell__sidebar" aria-label="Angular state panels">
      <app-storage />

      <section class="active-panel" aria-label="Active module panel">
        <p class="active-panel__eyebrow">Active module panel</p>
        <h2>{{ activePanelLabel() }}</h2>
        <p>
          Selected module
          <strong>{{ selectedModuleId() }}</strong>
        </p>
      </section>
    </aside>

    <section class="stage" aria-label="Visual layer placeholder">
      <app-phaser-game />
    </section>
  </main>
</section>
